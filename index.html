<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>むぎゅ工房 Mugyu Kobo</title>
<meta name="description" content="個人で小さなゲームやアプリを作っている「むぎゅ工房」のサイトです。">
<style>
:root{--ink:#5a3825;--bg:#fff8ec;--card:#fff;--accent:#ff8a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:40px 16px 56px}
h1{margin:0;font-size:2rem;letter-spacing:.05em}
.sub{margin:.2em 0 2em;opacity:.8}
.app{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px}
.app img{width:88px;height:88px;border-radius:20px;flex:none}
.app h2{margin:0 0 .2em;font-size:1.25rem}
.app p{margin:0 0 .6em;font-size:.95rem}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:.45em 1.1em;border-radius:999px;margin:.2em .4em .2em 0;font-size:.9rem}
.btn.sub2{background:#fff;color:var(--ink);border:2px solid var(--ink)}
h3{margin:2.2em 0 .5em;font-size:1.05rem}
ul{margin:0;padding-left:1.2em}
a{color:#c4561a}
footer{margin-top:3em;font-size:.8rem;opacity:.7}
</style>
</head>
<body>
<main>
  <h1>むぎゅ工房</h1>
  <p class="sub">Mugyu Kobo — 小さなゲームとアプリを作っています。</p>

  <div class="app">
    <img src="mugyuneko.png" alt="むぎゅねこパズルのアイコン">
    <div>
      <h2>むぎゅねこパズル</h2>
      <p>同じ色のねこをなぞってつなげる、ゆるかわパズルRPG。スタミナなし、広告は自分で選んだときだけ。</p>
      <a class="btn" href="https://apps.apple.com/app/apple-store/id6837864184?pt=129260872&amp;ct=site&amp;mt=8">App Store で見る</a>
      <a class="btn sub2" href="https://detailed-drifter-3da.notion.site/41f47592e1da809c9954eb71760adfc6">サポート</a>
      <a class="btn sub2" href="https://detailed-drifter-3da.notion.site/88647592e1da83638512816860947a88">プライバシーポリシー</a>
    </div>
  </div>

  <h3>お知らせ・SNS</h3>
  <ul>
    <li><a href="https://x.com/mugyu_kobo">X（@mugyu_kobo）</a></li>
    <li><a href="https://www.youtube.com/@mugyu_kobo">YouTube</a></li>
    <li><a href="https://note.com/mugyu_kobo">note</a></li>
  </ul>

  <footer>© 2026 むぎゅ工房</footer>
</main>
</body>
</html>
